# Google Cloud Build CI/CD pipeline for OpsGuardian
steps:
  - id: lint-and-unit-test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install --no-cache-dir -e ".[dev]"
        ruff check opsguardian eval deployment tests
        pytest tests/
        python -m eval.run_eval --offline --output eval/reports/cloudbuild_eval.json

  - id: build-container
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/opsguardian:${SHORT_SHA}"
      - .

  - id: push-container
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/opsguardian:${SHORT_SHA}"

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - opsguardian-agent
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/opsguardian:${SHORT_SHA}
      - --region=${_REGION}
      - --service-account=opsguardian-agent-sa@${PROJECT_ID}.iam.gserviceaccount.com
      - --set-env-vars=OPSGUARDIAN_ENV=gcp,GOOGLE_GENAI_USE_VERTEXAI=TRUE,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_REGION},OPSGUARDIAN_ENABLE_CLOUD_DLP=true,OPSGUARDIAN_ENABLE_CLOUD_TRACE=true
      - --no-allow-unauthenticated

substitutions:
  _REGION: us-central1
  _AR_REPO: opsguardian

options:
  logging: CLOUD_LOGGING_ONLY
