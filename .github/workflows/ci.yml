name: AgentOps CI & Evaluation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test-eval:
    name: Lint, Typecheck, Unit Tests & Offline Eval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check opsguardian eval deployment tests
          ruff format --check opsguardian eval deployment tests

      - name: Typecheck with Mypy
        run: mypy opsguardian

      - name: Run unit & integration tests
        run: pytest tests/ --cov=opsguardian --cov-report=term-missing

      - name: Run deterministic golden-dataset eval & AgentOps security audit
        run: python -m eval.run_eval --offline --output eval/reports/ci_eval_report.json

      - name: Upload evaluation report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opsguardian-eval-report
          path: eval/reports/ci_eval_report.json

  terraform-validate:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate
